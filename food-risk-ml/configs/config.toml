# Training configuration. All paths are relative to the food-risk-ml/ directory.

seed = 42
default_pathogen = "salmonella"   # CLI: --pathogen <key>

# One FSIS pathogen model per section. Each has its own mapping, canonical table, reports and model registry, so
# models never overwrite each other. Salmonella keeps the original paths.
[pathogens.salmonella]
name = "Salmonella"
mapping = "configs/source_mapping.toml"
processed = "data/processed/canonical.csv"
reports = "reports"
registry = "artifacts/registry"

[pathogens.campylobacter]
name = "Campylobacter"
mapping = "configs/source_mapping_campylobacter.toml"
processed = "data/processed/canonical_campylobacter.csv"
reports = "reports/campylobacter"
registry = "artifacts/registry_campylobacter"

[split]
# Chronological split by sample_date on fixed calendar dates shared by every pathogen:
# train < val_start <= val < backtest.sealed_test_start <= test. The dates are those of the first real (Salmonella)
# run, which used 70/15/15 by rows; fixing them stops the test window moving with each pathogen's row counts.
val_start = "2023-02-22"
# train_frac / val_frac are used only by the grouped fallback below.
train_frac = 0.70
val_frac = 0.15
# If more than this fraction of rows lack a valid sample_date, dates are treated as unreliable and the
# documented fallback (group split by establishment_id) is used instead.
max_missing_date_frac = 0.05

[features]
# Lab results are not available on the sampling day. An earlier sample only contributes to establishment
# history features if prior_date + label_lag_days < current sample_date.
# ASSUMPTION: 7 days. Replace with the actual FSIS reporting turnaround once known.
label_lag_days = 7
# Beta-prior smoothing strength (pseudo-samples) for the establishment positive rate.
history_smoothing = 20.0
# Categories seen fewer than this many times in training collapse to an "infrequent" bucket.
min_category_count = 10

[imbalance]
# "class_weight": reweight positives (LR/RF: class_weight="balanced"; XGB: scale_pos_weight=neg/pos).
# "none": no reweighting; rely on validation threshold tuning only.
strategy = "class_weight"

[models.logistic_regression]
C = 1.0
max_iter = 2000

[models.random_forest]
n_estimators = 400
min_samples_leaf = 5
n_jobs = -1

[models.xgboost]
n_estimators = 400
max_depth = 4
learning_rate = 0.05
subsample = 0.8
colsample_bytree = 0.8

[selection]
# The model with the best validation PR-AUC wins, except that every model within tie_tolerance of the best counts
# as tied, and a tie goes to the earliest name in `preference` (cheapest to explain per request and to ship to
# LinuxONE). 0.005 is about 10x the gap that made a 400-tree forest beat XGBoost on Campylobacter validation
# (0.4359 vs 0.4354), while the backtest ranked them the other way (0.4024 vs 0.4025).
tie_tolerance = 0.005
preference = ["xgboost", "logistic_regression", "random_forest"]

[threshold]
# "min_recall": highest-precision threshold whose validation recall >= target_recall (falls back to max_f1).
# "max_f1": threshold maximising validation F1.
policy = "min_recall"
target_recall = 0.80

[backtest]
# Rows on/after this date are SEALED: excluded from development, history and backtests. It equals the start of
# the test partition of the first real run (reports/metrics.json), which has already been looked at once, so
# from now on it is scored exactly once more, for the final model.
sealed_test_start = "2024-10-11"
# Rolling folds: one fiscal year each (FSIS FY starts 1 October); each trains on everything before its start.
fold_starts = ["2020-10-01", "2021-10-01", "2022-10-01", "2023-10-01"]
fold_months = 12
budgets = [0.10, 0.20, 0.30]
bootstrap = 200
min_programme_rows = 300

[explain]
top_k = 5
# Test rows sampled for global SHAP importance.
shap_sample = 1000
