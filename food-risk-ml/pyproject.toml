[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "food-risk-ml"
version = "0.1.0"
description = "Person B ML component: Salmonella sample-positivity risk model on USDA FSIS raw poultry sampling data"
requires-python = ">=3.11"
# Lower bounds = versions the test suite passed with (numpy 2.2.4, pandas 2.2.3, scikit-learn 1.5.2,
# matplotlib 3.10.1, joblib 1.4.2, fastapi 0.115.11, pydantic 2.10.6), close to Debian 13 s390x packages.
# xgboost and shap are optional: no s390x wheels on PyPI; see reports/linuxone_modeling_compatibility.md.
dependencies = [
    "pandas>=2.2",
    "numpy>=2.2",
    "scikit-learn>=1.5",
    "joblib>=1.4",
    "matplotlib>=3.10",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.10",
]

[project.optional-dependencies]
boost = ["xgboost>=3.0"]
explain = ["shap>=0.46"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
food-risk = "src.cli:main"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 125
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
